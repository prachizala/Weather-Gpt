services:
  - type: web
    name: weathergpt-app
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 8000
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: LLM_MODEL_MAIN
        value: google/gemini-2.5-flash
      - key: LLM_MODEL_FAST
        value: google/gemini-2.5-flash-lite
